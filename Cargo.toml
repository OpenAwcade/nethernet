[workspace]
resolver = "3"
members = ["nethernet", "nethernet-tokio"] 

[workspace.dependencies]
tokio = { version = "1.53.1", features = ["full"] }
tokio-util = { version = "0.7", features = ["io", "codec"] }
bytes = "1.12.1"
thiserror = "2.0.20"
tracing = "0.1.44"
byteorder = "1.5.0"
rand = "0.10"
futures = "0.3.34"
bitflags = "2.13.2"
aes = "0.9.3"
sha2 = "0.11.0"
hmac = "0.13.0"
hex = "0.4.3"
serde = { version = "1.0.229", features = ["derive"] }
url = "2.5.8"
reqwest = { version = "0.13.5", default-features = false, features = ["rustls-no-provider", "http2", "charset"] }
rustls = { version = "0.23.44", default-features = false, features = ["ring"] }
webrtc = "0.20.5"
async-trait = "0.1.89"